<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Management System - Student & Admin Login</title>
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>Scholarship Portal</h1>
                <p>Student & Administrator Login Portal</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <div class="input-icon-wrapper">
                        <input type="email" id="login-email" class="form-control" placeholder="student@university.edu" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-icon-wrapper">
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" id="toggle-password" class="toggle-password" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
                    <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-muted);">
                        <input type="checkbox" id="remember-me"> Remember me
                    </label>
                    <a href="#" id="forgot-password-link" style="color: var(--primary); font-weight: 500;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--text-muted);">
                Don't have an account? 
                <a href="register.html" style="font-weight: 600; color: var(--primary);">Register New User</a>
            </div>

            <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center; font-size: 0.78rem; color: var(--text-light);">
                <i class="fas fa-shield-alt"></i> Secure Portal • Ministry & University Scholarship Network
            </div>
        </div>
    </div>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
